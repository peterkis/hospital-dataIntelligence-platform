      description: 不泄露配置
      parameters:
      - $ref: '#/components/parameters/PurposeOfUse'
      - $ref: '#/components/parameters/TraceId'
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
      security:
      - oauth2:
        - public/monitor
      x-sla: P95<100ms
      responses:
        '200':
          description: 成功
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResource'
        '400':
          description: 请求不合法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 未认证
        '403':
          description: 无权限或用途不符
        '409':
          description: 版本/幂等冲突
        '429':
          description: 限流
        '500':
          description: 服务异常
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://iam.hospital.example.cn/realms/data/protocol/openid-connect/token
          scopes:
            mpi.patient.read: 患者黄金记录
            mpi.patient.merge: 患者合并
            mpi.patient.unmerge: 患者拆分
            mdm.department.read: 科室查询
            mdm.staff.read: 人员角色查询
            terminology.read: 值域展开
            terminology.translate: 代码翻译
            cdr.encounter.read: 就诊查询
            cdr.observation.read: 观察/检验查询
            document.write: 文档注册
            document.read: 文档检索
            quality.admin: 质量规则注册
            quality.issue.read: 质量问题查询
            lineage.read: 资产血缘
            subscription.manage: 订阅申请
            evidence.write: 证据登记
            public/monitor: 健康检查
  schemas:
    Error:
      type: object
      required:
      - code
      - message
      - traceId
      properties:
        code:
          type: string
        message:
          type: string
        traceId:
          type: string
        details:
          type: array
          items:
            type: object
    PageMeta:
      type: object
      properties:
        page:
          type: integer
        size:
          type: integer
        total:
          type: integer
          format: int64
    GenericResource:
      type: object
      additionalProperties: true
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
          format: int64
        status:
          type: string
        provenance:
          type: object
          additionalProperties: true
    PatientSearchResult:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PatientMaster'
        page:
          $ref: '#/components/schemas/PageMeta'
    PatientMaster:
      allOf:
      - $ref: '#/components/schemas/GenericResource'
      - type: object
        properties:
          enterprisePatientId:
            type: string
            format: uuid
          identifiers:
            type: array
            items:
              type: object
          name:
            type: string
          genderCode:
            type: string
          birthDate:
            type: string
            format: date
          links:
            type: array
            items:
              type: object
    ValueSetExpansion:
      type: object
      properties:
        valueSetCode:
          type: string
        version:
          type: string
        items:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
              display:
                type: string
              status:
                type: string
    ConceptTranslation:
      type: object
      properties:
        sourceSystem:
          type: string
        sourceCode:
          type: string
        targetSystem:
          type: string
        targetCode:
          type: string
        equivalence:
          type: string
    MasterChangeRequest:
      type: object
      required:
      - objectType
      - changeType
      - payload
      - reason
      properties:
        objectType:
          type: string
        changeType:
          type: string
        payload:
          type: object
          additionalProperties: true
        reason:
          type: string
        effectiveAt:
          type: string
          format: date-time
    QualityIssue:
      type: object
      properties:
        issueId:
          type: string
          format: uuid
        ruleCode:
          type: string
        severity:
          type: string
        status:
          type: string
        owner:
          type: string
        dueAt:
          type: string
          format: date-time
    ClinicalTimeline:
      type: object
      properties:
        enterprisePatientId:
          type: string
          format: uuid
        events:
          type: array
          items:
            type: object
            additionalProperties: true
    ExportRequest:
      type: object
      required:
      - purpose
      - dataset
      - fields
      - retentionDays
      properties:
        purpose:
          type: string
        dataset:
          type: string
        fields:
          type: array
          items:
            type: string
        retentionDays:
          type: integer
        deidentificationProfile:
          type: string
    ExportRequestStatus:
      type: object
      properties:
        requestId:
          type: string
          format: uuid
        status:
          type: string
        approvalTrail:
          type: array
          items:
            type: object
        expiresAt:
          type: string
          format: date-time
  parameters:
    PurposeOfUse:
      name: X-Purpose-Of-Use
      in: header
      required: true
      schema:
        type: string
      description: 数据使用目的代码
    TraceId:
      name: X-Trace-Id
      in: header
      required: false
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 128
    IfMatch:
      name: If-Match
      in: header
      required: false
      schema:
        type: string
      description: 乐观锁版本
security:
- oauth2: []
