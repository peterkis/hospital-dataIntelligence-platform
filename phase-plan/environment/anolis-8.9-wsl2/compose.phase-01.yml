services:
  postgres:
    image: postgres@sha256:882236b897e39051d2368c5ccc6cda944904723506b2dfc97f2a8f5bc9afa382
    pull_policy: never
    labels: &formal-runtime-labels
      hdi.repository: hospital-data-intelligence-platform
      hdi.phase: "01"
      hdi.run-id: ${ABG_RUN_ID:-manual-bootstrap}
      hdi.run-sequence: ${ABG_RUN_SEQUENCE:-0}
      hdi.managed-by: ${ABG_MANAGED_BY:-phase-01-bootstrap}
    environment:
      POSTGRES_DB: hdi_phase01
      POSTGRES_USER: hdi_phase01
      POSTGRES_PASSWORD: ${HDI_POSTGRES_PASSWORD:?HDI_POSTGRES_PASSWORD is required}
      TZ: Asia/Shanghai
    command: ["-c", "timezone=Asia/Shanghai"]
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - phase01_postgres_data:/var/lib/postgresql
    networks:
      - phase01_runtime
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username hdi_phase01 --dbname hdi_phase01"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak@sha256:0f198be292568439d700cdbfb893e69a6009bb43a94a06a945b1d3d506c76b13
    pull_policy: never
    labels: *formal-runtime-labels
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${HDI_KEYCLOAK_ADMIN_USERNAME:?HDI_KEYCLOAK_ADMIN_USERNAME is required}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${HDI_KEYCLOAK_ADMIN_PASSWORD:?HDI_KEYCLOAK_ADMIN_PASSWORD is required}
      KC_HEALTH_ENABLED: "true"
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:18080:8080"
      - "127.0.0.1:19000:9000"
    volumes:
      - ${HDI_KEYCLOAK_REALM_IMPORT_DIR:?HDI_KEYCLOAK_REALM_IMPORT_DIR is required}:/opt/keycloak/data/import:ro
      - phase01_keycloak_data:/opt/keycloak/data
    networks:
      - phase01_runtime
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3",
        ]
      interval: 3s
      timeout: 3s
      retries: 40
    restart: unless-stopped

volumes:
  phase01_postgres_data:
    labels: *formal-runtime-labels
  phase01_keycloak_data:
    labels: *formal-runtime-labels

networks:
  phase01_runtime:
    labels: *formal-runtime-labels
