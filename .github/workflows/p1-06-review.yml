name: P1-06 review regression
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/p1-06-review.yml'
      - 'apps/admin-web/src/vnext/**'
      - 'apps/governance-api/**'
      - 'db/vnext/**'
      - 'tooling/vnext/**'
      - 'packages/**'
      - 'package*.json'
permissions:
  contents: read
concurrency:
  group: p1-06-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  workspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: synthetic-review-only
        ports:
          - 127.0.0.1:55434:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: npm
      - run: npm install --global npm@11.9.0
      - id: install
        run: npm ci
      - name: Record exact candidate
        run: git rev-parse HEAD
      - name: Workspace unit regressions
        run: npm run vnext:p1-06:unit
      - name: Workspace typecheck
        run: npm run vnext:p1-06:typecheck
      - name: Admin web typecheck and build
        run: npm --workspace packages/generated-api-client run build && npm --workspace apps/admin-web run typecheck && npm --workspace apps/admin-web run build:vnext
      - name: PostgreSQL client
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)
      - name: Fresh PostgreSQL Owner and HTTP regressions
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          HDIP_REVIEW_CI_ADMIN_URL: postgresql://postgres:synthetic-review-only@127.0.0.1:55434/postgres
        run: npx vitest run --config tooling/vnext/vitest.p1-06-review-ci.config.ts
      - name: Real browser submission and upload races
        env:
          HDIP_REVIEW_CI_ADMIN_URL: postgresql://postgres:synthetic-review-only@127.0.0.1:55434/postgres
          HDIP_REVIEW_BROWSER_EXECUTABLE: google-chrome
        run: |
          command -v google-chrome
          google-chrome --version
          npx vitest run --config tooling/vnext/vitest.p1-06-browser-ci.config.ts
      - name: Populated 0071 to 0072 upgrade and regression
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          HDIP_REVIEW_CI_ADMIN_URL: postgresql://postgres:synthetic-review-only@127.0.0.1:55434/postgres
          HDIP_REVIEW_CI_UPGRADE: '1'
        run: npx vitest run --config tooling/vnext/vitest.p1-06-review-ci.config.ts tooling/vnext/p1-06-review-db.test.ts
      - name: Populated 0072 to 0073 exact-license upgrade
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          HDIP_REVIEW_CI_ADMIN_URL: postgresql://postgres:synthetic-review-only@127.0.0.1:55434/postgres
          HDIP_REVIEW_CI_LICENSE_UPGRADE: '1'
        run: npx vitest run --config tooling/vnext/vitest.p1-06-review-ci.config.ts tooling/vnext/p1-06-exact-transport-db.test.ts
