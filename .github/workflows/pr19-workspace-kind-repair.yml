name: PR19 workspace kind migration correction
on:
  push:
    branches:
      - codex/p1-07-campus-lifecycle
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/p1-07-campus-lifecycle
          fetch-depth: 0
      - name: Correct the exact dynamic SQL identifier
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          migration = Path('db/vnext/migrations/0079_campus_retirement_disposition.sql')
          text = migration.read_text()
          old = "'canActivate',p_kid='CAMPUS'"
          new = "'canActivate',p_kind='CAMPUS'"
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one p_kid defect, found {text.count(old)}')
          migration.write_text(text.replace(old, new))
          Path('.github/workflows/pr19-workspace-kind-repair.yml').unlink()
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add db/vnext/migrations/0079_campus_retirement_disposition.sql .github/workflows/pr19-workspace-kind-repair.yml
          git commit -m "fix: correct workspace campus kind identifier"
          git push origin HEAD:codex/p1-07-campus-lifecycle
