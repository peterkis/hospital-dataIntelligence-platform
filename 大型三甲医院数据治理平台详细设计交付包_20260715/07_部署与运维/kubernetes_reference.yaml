# 参考Kubernetes清单：展示隔离、反亲和、PDB、探针、资源与NetworkPolicy。
# 不包含真实域名、镜像仓库、密码或生产证书。
apiVersion: v1
kind: Namespace
metadata:
  name: hdgp-service
  labels: {security-zone: service}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mdm-api
  namespace: hdgp-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mdm-api
  namespace: hdgp-service
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app: mdm-api}
  template:
    metadata:
      labels: {app: mdm-api, data-classification: high}
    spec:
      serviceAccountName: mdm-api
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector: {matchLabels: {app: mdm-api}}
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector: {matchLabels: {app: mdm-api}}
      containers:
        - name: mdm-api
          image: registry.hospital.example.cn/hdgp/mdm-api@sha256:REPLACE_ME
          imagePullPolicy: IfNotPresent
          ports: [{name: https, containerPort: 8443}]
          env:
            - {name: JAVA_TOOL_OPTIONS, value: '-XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError'}
            - {name: DB_SECRET_REF, value: 'vault://hdgp/prod/mdm-db'}
          resources:
            requests: {cpu: '2', memory: 4Gi}
            limits: {cpu: '8', memory: 12Gi}
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: https, scheme: HTTPS}
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: https, scheme: HTTPS}
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 3
          startupProbe:
            httpGet: {path: /actuator/health, port: https, scheme: HTTPS}
            failureThreshold: 30
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ['ALL']}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mdm-api
  namespace: hdgp-service
spec:
  minAvailable: 2
  selector: {matchLabels: {app: mdm-api}}
---
apiVersion: v1
kind: Service
metadata:
  name: mdm-api
  namespace: hdgp-service
spec:
  selector: {app: mdm-api}
  ports: [{name: https, port: 443, targetPort: https}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mdm-api
  namespace: hdgp-service
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: mdm-api}
  minReplicas: 3
  maxReplicas: 12
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 600
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 60}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mdm-api-default-deny-and-allow
  namespace: hdgp-service
spec:
  podSelector: {matchLabels: {app: mdm-api}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {security-zone: gateway}}
      ports: [{protocol: TCP, port: 8443}]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {security-zone: data}}
      ports:
        - {protocol: TCP, port: 5432}
        - {protocol: TCP, port: 9093}
    - to:
        - namespaceSelector: {matchLabels: {security-zone: identity}}
      ports: [{protocol: TCP, port: 443}]
